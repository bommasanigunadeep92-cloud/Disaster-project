version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_ops_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:///./disaster_platform.db
      - JWT_SECRET_KEY=demo_secret_key_change_in_production_8947291038571
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    volumes:
      - ./backend/disaster_platform.db:/app/disaster_platform.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster_ops_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
